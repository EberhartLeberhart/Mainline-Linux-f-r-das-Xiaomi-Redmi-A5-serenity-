# /etc/redmi/akku.conf - Einstellungen fuer redmi-akku.sh
# MODUS=server -> Ladegrenze aktiv; alles andere (z.B. handy) -> normal voll laden
MODUS=server
OBEN=80        # darueber: Strom kappen, bis OBEN erreicht
UNTEN=75       # darunter: wieder laden bis OBEN; dazwischen ruht der Akku
NOTFALL=20     # darunter: immer laden, egal was
INTERVALL=60   # Sekunden zwischen zwei Entscheidungen nach Akkustand
PRUEF=10       # Sekunden zwischen zwei Chip-Pruefungen (Einstecken setzt HIZ/Eingangsstrom zurueck)
EINGANG_MAX=500  # hoechster Eingangsstrom in mA (PC-Anschluss: 500; Hub mit Netzteil z.B. 1500)
