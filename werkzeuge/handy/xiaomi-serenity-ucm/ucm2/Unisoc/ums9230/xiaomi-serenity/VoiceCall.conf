SectionVerb {
	EnableSequence [
		cset "name='TX0 SEL' IIS0"
		cset "name='RX0 SEL' IIS1"

		cset "name='TX1 SEL' IIS0"
		cset "name='RX2 SEL' IIS1"

		cset "name='FE_FAST_PLAYBACK TX Switch' on"
		cset "name='FE_VOICE TX Switch' on"
		cset "name='FE_VOICE RX Switch' on"

		cset "name='Voice Record Downlink' on"
		cset "name='Voice Record Uplink' on"
	]

	DisableSequence [
		cset "name='Voice Record Downlink' off"
		cset "name='Voice Record Uplink' off"

		cset "name='FE_VOICE TX Switch' off"
		cset "name='FE_VOICE RX Switch' off"
		cset "name='FE_FAST_PLAYBACK TX Switch' off"
	]

	Value {
		CaptureRate 8000
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevices [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		cset "name='TX0 MIXER0 Mode' NOT_MIX"
		cset "name='Headphone Playback Switch' on"
		cset "name='Headphone Volume' 9"
	]

	DisableSequence [
		cset "name='Headphone Volume' 0"
		cset "name='Headphone Playback Switch' off"
	]

	Value {
		PlaybackPriority 300
		PlaybackChannels 2
		PlaybackPCM "hw:0,0"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	ConflictingDevices [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='TX0 MIXER0 Mode' NOT_MIX"
		cset "name='Speaker Switch' on"
		cset "name='SPK Volume' 0"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackPCM "hw:0,0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece playback"

	ConflictingDevices [
		"Headphones"
		"Speaker"
	]

	EnableSequence [
		cset "name='TX0 MIXER0 Mode' HALF_ADD"
		cset "name='Earpiece Playback Switch' on"
		cset "name='Earpiece Volume' 11"
	]

	DisableSequence [
		cset "name='Earpiece Volume' 0"
		cset "name='Earpiece Playback Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:0,0"
	}
}

SectionDevice."Mic" {
	Comment "Microphone capture"

	ConflictingDevices [
		"Headset"
	]

	EnableSequence [
		cset "name='ADCL Mixer MIC' on"
		cset "name='Capture Volume' 7"
	]

	DisableSequence [
		cset "name='ADCL Mixer MIC' off"
	]

	Value {
		CapturePriority 200
		CaptureChannels 1
		CapturePCM "hw:0,3"
	}
}

SectionDevice."Headset" {
	Comment "Headset capture"

	ConflictingDevices [
		"Mic"
	]

	EnableSequence [
		cset "name='ADCL Mixer HPMIC' on"
		cset "name='Capture Volume' 7"
	]

	DisableSequence [
		cset "name='ADCL Mixer HPMIC' off"
	]

	Value {
		CapturePriority 300
		CaptureChannels 1
		CapturePCM "hw:0,3"
	}
}
