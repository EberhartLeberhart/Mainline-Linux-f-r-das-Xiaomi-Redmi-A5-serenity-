# /etc/systemd/logind.conf.d/redmi-taste.conf - gehoert zu redmi-taste.sh/.service:
# logind soll die Einschalttaste nicht selbst behandeln (Ubuntu-Standard: kurzer Druck = sofort ausschalten).
# Dann gilt redmi-taste.sh: 3 s halten = Herunterfahren, kurz = Licht kurz an. Beleg 07.11. am zweiten Redmi.
[Login]
HandlePowerKey=ignore
