# Komprimierter Auslagerungsspeicher im RAM (ZRAM, Kernel-Patch 0049) fuer systemd-zram-generator.
# Nach /etc/systemd/zram-generator.conf kopieren, Paket: Ubuntu "systemd-zram-generator" (universe),
# Arch "zram-generator". Beim naechsten Start erscheint /dev/zram0 als Swap.
# Groesse: halber RAM, hoechstens 4 GB (Redmi A5 mit 4 GB RAM -> 1,8 GB).
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
