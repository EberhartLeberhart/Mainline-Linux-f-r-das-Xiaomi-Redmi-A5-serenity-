SectionVerb {
	EnableSequence [
		# Routing (auch in der BootSequence); TX0 MIXER0 HALF_ADD ergibt Stille
		cset "name='TX0 SEL' IIS0"
		cset "name='RX0 SEL' IIS1"
		cset "name='TX0 MIXER0 Mode' NOT_MIX"
		cset "name='FE_FAST_PLAYBACK TX Switch' on"
		cset "name='FE_CAPTURE_DSP RX Switch' on"
	]
	# Absichtlich kein Ausschalten von FE_FAST_PLAYBACK (DMA-Falle, siehe Hauptdatei)

	Value {
		TQ "HiFi"
	}
}

# Keine Klinkenerkennung bisher: der Lautsprecher hat Vorrang, Kopfhoerer waehlt man von Hand.
SectionDevice."Speaker" {
	Comment "Lautsprecher"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		# SPK Volume 0 ist schon laut (1,5-dB-Stufen) - Lautstaerke regelt PipeWire
		cset "name='SPK Volume' 0"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Kopfhoerer"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		# Stufe 8 = 0 dB
		cset "name='Headphone Volume' 8"
		cset "name='Headphone Playback Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Playback Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
