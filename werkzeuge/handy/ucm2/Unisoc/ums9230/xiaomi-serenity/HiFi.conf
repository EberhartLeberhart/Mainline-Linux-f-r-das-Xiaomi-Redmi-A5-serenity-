SectionVerb {
	EnableSequence [
		# Routing (auch in der BootSequence); TX0 MIXER0 HALF_ADD ergibt Stille
		cset "name='TX0 SEL' IIS0"
		cset "name='RX0 SEL' IIS1"
		cset "name='TX0 MIXER0 Mode' NOT_MIX"
		cset "name='FE_FAST_PLAYBACK TX Switch' on"
		cset "name='FE_CAPTURE_DSP RX Switch' on"
	]
	# Absichtlich kein Ausschalten von FE_FAST_PLAYBACK (DMA-Falle, siehe Hauptdatei)

	Value {
		TQ "HiFi"
	}
}

# Keine Klinkenerkennung bisher: der Lautsprecher hat Vorrang, Kopfhoerer waehlt man von Hand.
SectionDevice."Speaker" {
	Comment "Lautsprecher"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		# SPK Volume 0 ist schon laut (1,5-dB-Stufen) - Lautstaerke regelt PipeWire
		cset "name='SPK Volume' 0"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Kopfhoerer"

	ConflictingDevice [
		"Speaker"
	]

	EnableSequence [
		# Stufe 8 = 0 dB
		cset "name='Headphone Volume' 8"
		cset "name='Headphone Playback Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Playback Switch' off"
	]

	# 20.11.: Klinkenerkennung im Codec (Patch 0056, ALSA-Schalter "Headphones Jack"): Kopfhoerer ist nur
	# verfuegbar, wenn einer steckt - dann hat er Vorrang vor dem Lautsprecher.
	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphones Jack"
	}
}

# 19.11.: Mikrofon unten (ADCL <- MIC). Es gibt nur EIN Mikrofon (Handy 2 geoeffnet);
# MIC2 ist unbeschaltet, ADCR wird trotzdem eingeschaltet: ausgeschaltet liefert der
# rechte Kanal einen festen Wert am Anschlag (-32768), eingeschaltet saubere Stille.
# Pegel mit Capture Volume 7 (+21 dB) beim Sprechen aus der Hand: Spitze ~14000 von 32767.
SectionDevice."Mic" {
	Comment "Mikrofon"

	EnableSequence [
		cset "name='Capture Volume' 7,7"
		cset "name='ADCL Mixer MIC' on"
		cset "name='ADCR Mixer MIC2' on"
	]

	DisableSequence [
		cset "name='ADCL Mixer MIC' off"
		cset "name='ADCR Mixer MIC2' off"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
