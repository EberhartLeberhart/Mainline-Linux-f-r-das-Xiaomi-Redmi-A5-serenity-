# UCM fuer den Xiaomi Redmi A5 / POCO C71 (serenity), Kernel-Patches 0039-0041.
# Grundlage: Profil von farrizdesignpro1339 (PR #47/#50), das auf Otto Pfluegers
# ums9230-mainline/alsa-ucm-conf (Reeder S19 Max Pro S) aufbaut; aufgeraeumt
# auf das, was getestet ist: Lautsprecher, Kopfhoerer, Mikrofon (19.11.).
# Die Hoermuschel ist beim Redmi A5 derselbe Lautsprecher oben (EAR des PMIC unbeschaltet).
Syntax 4

Comment "Xiaomi Redmi A5 (serenity)"

SectionUseCase."HiFi" {
	File "/Unisoc/ums9230/xiaomi-serenity/HiFi.conf"
	Comment "Musik und Systemklang"
}

# Audio-DMA-Falle: Wird abgespielt, bevor FE_FAST_PLAYBACK an ist, haengt der DMA bis
# zum Neustart. Darum setzt FixedBootSequence das Routing bei JEDEM Start (auch nach
# alsactl restore), es bleibt danach an.
FixedBootSequence [
	cset "name='TX0 SEL' IIS0"
	cset "name='RX0 SEL' IIS1"
	cset "name='TX0 MIXER0 Mode' NOT_MIX"
	cset "name='FE_FAST_PLAYBACK TX Switch' on"
	cset "name='FE_CAPTURE_DSP RX Switch' on"
]

# Startwerte nur beim allerersten Start (ohne gespeicherten Reglerstand)
BootSequence [
	cset "name='Speaker Switch' off"
	cset "name='Headphone Playback Switch' off"
	cset "name='SPK Volume' 0"
	cset "name='Headphone Volume' 8"
	cset "name='ADCL Mixer MIC' off"
	cset "name='ADCR Mixer MIC2' off"
	cset "name='Capture Volume' 7,7"
]
