# /etc/redmi/licht.conf - Einstellungen fuer redmi-licht.sh
START=aus   # aus = Server: Licht 10 s nach dem Start aus; an = Licht bleibt an
HELL=500    # Helligkeit fuer "an" und "kurz" (0-4095; 500 = Xiaomi-Standard)
KURZ=30     # Sekunden Licht nach kurzem Druck auf die Einschalttaste
WEG=treiber # Schlaf ueber den Display-Treiber (Standard ab 29.10.); dcs = alter Weg per DSI-Befehl
